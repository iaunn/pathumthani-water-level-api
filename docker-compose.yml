# Local MinIO + MongoDB so the app can run without cloud credentials.
# Production points the same env vars at R2 / S3 / a managed MongoDB instead.
# Create the bucket once after first start — see "Local development" in readme.md.
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  # Talks to every camera so the app does not have to. Credentials for the two
  # Axis cameras arrive as MTX_PATHS_* overrides, never in mediamtx.yml.
  # Pinned: option names move between releases and mediamtx.yml targets this one.
  mediamtx:
    # The -ffmpeg variant, not the plain one: that image is distroless, with no
# ffmpeg for bridge2's runOnDemand and no CA bundle, so every https source
# fails certificate verification.
    image: bluenviron/mediamtx:1.21.1-ffmpeg
    restart: unless-stopped
    env_file: [.env]
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    # Not published to the host: only the app needs to reach it. Add an
    # authInternalUsers section to mediamtx.yml first if you ever do publish it.
    expose: ["8888", "8554"]

  mongo:
    image: mongo:8
    # override when 27017 is already taken: MONGO_PORT=27018 docker compose up -d
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo-data:/data/db"]

volumes:
  minio-data:
  mongo-data:
