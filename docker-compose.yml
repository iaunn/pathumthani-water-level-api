# Local MinIO + MongoDB so the app can run without cloud credentials.
# Production points the same env vars at R2 / S3 / a managed MongoDB instead.
# Create the bucket once after first start — see "Local development" in readme.md.
services:
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

  mongo:
    image: mongo:8
    # override when 27017 is already taken: MONGO_PORT=27018 docker compose up -d
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: ["mongo-data:/data/db"]

volumes:
  minio-data:
  mongo-data:
