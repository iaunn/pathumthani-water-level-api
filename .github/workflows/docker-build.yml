name: Build and Push Multi-Platform Docker Image

on:
  push:
    branches:
      - main  # Trigger the action on push to the main branch
      - feature/object-storage-mongodb
  pull_request:
    branches:
      - main  # Optional: Trigger the action on pull requests to main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # Step 1: Set up QEMU for multi-platform builds
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      # Step 2: Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      # Step 3: Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 4: Log in to GitHub Docker registry
      - name: Log in to GitHub Docker registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      # Step 5: Create and use a new Buildx builder
      - name: Create Buildx builder
        run: docker buildx create --use --name multi-builder

      # Step 6: Inspect the builder to verify platforms support
      - name: Inspect Buildx builder
        run: docker buildx inspect --bootstrap

      # Step 7: Decide what this run publishes.
      # main owns :latest; a feature branch publishes under its own name only, so
      # it can never overwrite the image that deployments follow.
      - name: Resolve image tags
        id: tags
        env:
          BRANCH: ${{ github.ref_name }}
          EVENT: ${{ github.event_name }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            # Nothing to publish yet: build both platforms purely to prove it still builds.
            echo "args=--output type=cacheonly" >> "$GITHUB_OUTPUT"
          else
            case "$BRANCH" in
              main) tag=latest ;;
              # feature/object-storage-mongodb -> object-storage-mongodb
              *)    tag="${BRANCH#feature/}" ;;
            esac
            echo "args=--push --tag ${IMAGE}:${tag} --tag ${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Publishing ${IMAGE}:${tag}"
          fi

      # Step 8: Build and push Docker image for multiple platforms
      - name: Build and Push Multi-Platform Docker Image
        env:
          BUILD_ARGS: ${{ steps.tags.outputs.args }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            $BUILD_ARGS .

      # Optional Step 9: Clean up Buildx builder after build
      - name: Remove Buildx builder
        if: always()
        run: docker buildx rm multi-builder
